name: Static Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  code-style-check:
    runs-on: ubuntu-latest
    name: CodeStyle Check
    steps:
      - uses: actions/checkout@v6
      - name: Install python 📦
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Run pre-commit ✅
        uses: pre-commit/action@v3.0.1

  type-check:
    runs-on: ubuntu-latest
    name: Type Check
    steps:
      - uses: actions/checkout@v6
      - name: Install the latest version of uv 📦
        uses: astral-sh/setup-uv@v7
      - name: Install python 📦
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install dependencies 📦
        run: uv sync --all-extras --dev
      - name: Type Check 📦
        run: uv run pyright .
