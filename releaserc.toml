[semantic_release]
allow_zero_version = true
major_on_zero = false
tag_format = "{version}"
commit_author = "semantic-release <semantic-release>"
commit_message = "🔧 chore: release {version}\n\nAutomatically generated by python-semantic-release"
commit_parser = "emoji"

[semantic_release.commit_parser_options]
major_tags = ["💥 breaking"]
minor_tags = [
  "🎉 init",
  "✨ feat",
]
patch_tags = [
  "🐛 fix",
  "⚡ perf",
]
